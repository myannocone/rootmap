<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }
    textarea {
      width: 100%;
      height: 70px;
      margin-top: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 11px;
      border-radius: 4px;
      box-sizing: border-box;
      padding: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>⚡ RootMap Sync</h3>
  <p>Open your Yahoo Fantasy Matchup page, then click below to sync.</p>
  <button id="syncBtn">Sync Matchup to App</button>
  <div id="status"></div>
  <textarea id="output" readonly></textarea>

  <script src="popup.js"></script>
</body>
</html>
