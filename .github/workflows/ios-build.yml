name: Build and Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Upload iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios


      - name: Setup App Store Connect Key
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s" "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build and Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
        
          # 1. Authenticate API Key
          fastlane run app_store_connect_api_key key_id:"$APP_STORE_CONNECT_KEY_ID" issuer_id:"$APP_STORE_CONNECT_ISSUER_ID" key_filepath:"$KEY_PATH"
        
          # 2. Fetch/create distribution certificate and install to runner keychain
          fastlane run get_certificates api_key_path:"$KEY_PATH"
        
          # 3. Fetch/create App Store provisioning profile
          fastlane run get_provisioning_profile api_key_path:"$KEY_PATH" app_identifier:"com.myannocone.rootmap"
        
          # 4. Build and package the archive into an IPA
          fastlane run build_app project:"ios/App/App.xcodeproj" scheme:"App" export_method:"app-store"
        
          # 5. Upload to TestFlight
          fastlane run upload_to_testflight api_key_path:"$KEY_PATH" ipa:"./build/RootMap.ipa" skip_waiting_for_build_processing:true
