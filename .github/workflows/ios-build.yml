- name: Install distribution certificate
        env:
          BUILD_CERT_PEM: ${{ secrets.BUILD_CERT_PEM }}
          BUILD_KEY_PEM: ${{ secrets.BUILD_KEY_PEM }}
          KEYCHAIN_PASSWORD: temp_ci_password_123
        run: |
          echo "$BUILD_CERT_PEM" > "$RUNNER_TEMP/cert.pem"
          echo "$BUILD_KEY_PEM" > "$RUNNER_TEMP/key.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/build_certificate.p12" -passout pass:"$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/build_certificate.p12" -k build.keychain -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain