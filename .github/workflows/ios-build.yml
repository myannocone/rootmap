name: Build and Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Upload iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup App Store Connect Private Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build and Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          fastlane run app_store_connect_api_key \
            key_id:"$APP_STORE_CONNECT_KEY_ID" \
            issuer_id:"$APP_STORE_CONNECT_ISSUER_ID" \
            key_filepath:"$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          fastlane run build_app \
            workspace:"ios/App/App.xcworkspace" \
            scheme:"App" \
            export_method:"app-store" \
            output_directory:"./build" \
            output_name:"RootMap.ipa"

          fastlane run upload_to_testflight \
            ipa:"./build/RootMap.ipa" \
            skip_waiting_for_build_processing:true